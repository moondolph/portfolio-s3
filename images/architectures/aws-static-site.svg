<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="920" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">AWS static portfolio hosting and serverless visitor counter architecture</title>
  <desc id="desc">GitHub repository is deployed to S3 and delivered through CloudFront with Route 53 and ACM. On each page load the browser also calls an API Gateway endpoint backed by a Lambda function, which reads and writes daily and total visit counts in DynamoDB.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="920" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="6" fill="#ff9900"/>
  <text x="60" y="70" fill="#0f172a" font-family="Inter, Arial" font-size="28" font-weight="800">AWS Static Portfolio Hosting + Serverless Visitor Counter</text>
  <text x="60" y="100" fill="#64748b" font-family="Inter, Arial" font-size="15">GitHub → S3 → CloudFront → Route 53 / ACM → User &#160;&#160;|&#160;&#160; User → API Gateway → Lambda → DynamoDB</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Band 1: Static hosting (y 140-450) -->
  <rect x="50" y="140" width="1100" height="310" rx="18" fill="#fff8ec" stroke="#f7e2b8"/>
  <rect x="74" y="122" width="200" height="34" rx="17" fill="#ff9900"/>
  <text x="174" y="145" fill="#fff" font-family="Inter, Arial" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">1 · STATIC HOSTING</text>

  <g filter="url(#cardShadow)" text-anchor="middle">
    <rect x="90" y="260" width="150" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="165" cy="292" r="16" fill="#f8fafc"/>
    <text x="165" y="298" font-size="16">🐙</text>
    <text x="165" y="324" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">GitHub</text>
    <text x="165" y="342" fill="#64748b" font-family="Inter, Arial" font-size="12">Source code</text>

    <rect x="290" y="260" width="150" height="88" rx="14" fill="#ff9900"/>
    <circle cx="365" cy="292" r="16" fill="rgba(255,255,255,.25)"/>
    <text x="365" y="298" font-size="16">🪣</text>
    <text x="365" y="324" fill="#fff" font-family="Inter, Arial" font-weight="700" font-size="15">S3 Bucket</text>
    <text x="365" y="342" fill="rgba(255,255,255,.9)" font-family="Inter, Arial" font-size="12">Static files</text>

    <rect x="490" y="260" width="170" height="88" rx="14" fill="#ff9900"/>
    <circle cx="575" cy="292" r="16" fill="rgba(255,255,255,.25)"/>
    <text x="575" y="298" font-size="16">🌐</text>
    <text x="575" y="324" fill="#fff" font-family="Inter, Arial" font-weight="700" font-size="15">CloudFront</text>
    <text x="575" y="342" fill="rgba(255,255,255,.9)" font-family="Inter, Arial" font-size="12">CDN + HTTPS</text>

    <rect x="740" y="170" width="180" height="78" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="783" cy="200" r="14" fill="#f8fafc"/>
    <text x="783" y="205" font-size="14">🧭</text>
    <text x="805" y="200" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="14" text-anchor="start">Route 53</text>
    <text x="805" y="220" fill="#64748b" font-family="Inter, Arial" font-size="11" text-anchor="start">Custom domain</text>

    <rect x="740" y="356" width="180" height="78" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="783" cy="386" r="14" fill="#f8fafc"/>
    <text x="783" y="391" font-size="14">🔒</text>
    <text x="805" y="386" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="14" text-anchor="start">ACM</text>
    <text x="805" y="406" fill="#64748b" font-family="Inter, Arial" font-size="11" text-anchor="start">TLS Certificate</text>

    <rect x="980" y="260" width="130" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="1045" cy="292" r="16" fill="#f8fafc"/>
    <text x="1045" y="298" font-size="16">🙂</text>
    <text x="1045" y="324" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">User</text>
  </g>

  <g stroke="#ff9900" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M240 304H290"/><path d="M440 304H490"/><path d="M660 304H980"/>
    <path d="M660 290C700 260 700 209 740 209"/>
    <path d="M660 318C700 348 700 395 740 395"/>
  </g>

  <!-- Band 2: Serverless visitor counter (y 480-690) -->
  <rect x="50" y="480" width="1100" height="210" rx="18" fill="#eef3ff" stroke="#d6e2ff"/>
  <rect x="74" y="462" width="380" height="34" rx="17" fill="#1e4fff"/>
  <text x="264" y="485" fill="#fff" font-family="Inter, Arial" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">2 · SERVERLESS — VISITOR COUNTER API</text>

  <g filter="url(#cardShadow)" text-anchor="middle">
    <rect x="230" y="560" width="200" height="88" rx="14" fill="#1e4fff"/>
    <circle cx="270" cy="592" r="16" fill="rgba(255,255,255,.22)"/>
    <text x="270" y="598" font-size="16">🚪</text>
    <text x="330" y="590" fill="#fff" font-family="Inter, Arial" font-weight="700" font-size="15">API Gateway</text>
    <text x="330" y="610" fill="rgba(255,255,255,.9)" font-family="Inter, Arial" font-size="12">GET /visit</text>

    <rect x="490" y="560" width="180" height="88" rx="14" fill="#1e4fff"/>
    <circle cx="525" cy="592" r="16" fill="rgba(255,255,255,.22)"/>
    <text x="525" y="598" font-size="16">λ</text>
    <text x="580" y="590" fill="#fff" font-family="Inter, Arial" font-weight="700" font-size="15">Lambda</text>
    <text x="580" y="610" fill="rgba(255,255,255,.9)" font-family="Inter, Arial" font-size="12">Node.js 22.x</text>

    <rect x="730" y="560" width="210" height="88" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="770" cy="592" r="16" fill="#eef3ff"/>
    <text x="770" y="598" font-size="16">🗄️</text>
    <text x="835" y="590" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">DynamoDB</text>
    <text x="835" y="610" fill="#64748b" font-family="Inter, Arial" font-size="12">today / total visits</text>
  </g>
  <g stroke="#1e4fff" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M430 604H490"/><path d="M670 604H730"/>
  </g>

  <!-- User -> API Gateway trigger path -->
  <g stroke="#1e4fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7" opacity=".85">
    <path d="M1045 348V465H330V560"/>
  </g>
  <text x="360" y="461" fill="#1e4fff" font-family="Inter, Arial" font-size="13" font-weight="700">GET /visit on page load</text>
  <text x="835" y="672" fill="#64748b" font-family="Inter, Arial" font-size="12" text-anchor="middle">→ returns {today, total} JSON, rendered back to User</text>

  <!-- Legend -->
  <g font-family="Inter, Arial" font-size="13" fill="#64748b">
    <line x1="60" y1="730" x2="92" y2="730" stroke="#ff9900" stroke-width="3"/>
    <text x="100" y="734">정적 호스팅 흐름</text>
    <line x1="290" y1="730" x2="322" y2="730" stroke="#1e4fff" stroke-width="3"/>
    <text x="330" y="734">API 호출 흐름</text>
    <line x1="500" y1="730" x2="532" y2="730" stroke="#1e4fff" stroke-width="2.5" stroke-dasharray="6 7"/>
    <text x="540" y="734">방문자 카운터 트리거</text>
  </g>

  <!-- Insight footer -->
  <rect x="50" y="760" width="1100" height="130" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="78" y="792" fill="#334155" font-family="Inter, Arial" font-size="15" font-weight="700">이 포트폴리오, AWS로 직접 만들고 운영했습니다.</text>
  <text x="78" y="818" fill="#334155" font-family="Inter, Arial" font-size="14">S3·CloudFront로 정적 호스팅 구조를 설계하고, Route 53·ACM으로 커스텀 도메인과 HTTPS를 구성했으며,</text>
  <text x="78" y="840" fill="#334155" font-family="Inter, Arial" font-size="14">GitHub Actions로 배포를 자동화했습니다.</text>
  <text x="78" y="866" fill="#334155" font-family="Inter, Arial" font-size="14">방문자 카운터는 API Gateway + Lambda + DynamoDB 서버리스 구조로, 페이지 로드마다 호출됩니다.</text>
</svg>
