<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Japan National Health Insurance system: operations and root cause analysis workflow</title>
  <desc id="desc">A nationwide health insurance standardization system runs batch processing and instant-output jobs on Linux hosts. An SI/Ops engineer queries the Oracle Database via SQL and reviews system and batch logs to trace account, batch, and output errors to their root cause, then collaborates with the development team to stabilize and ship fixes, which flow back into the nationwide-deployed system.</desc>
  <defs>
    <filter id="cardShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity=".08"/>
    </filter>
  </defs>

  <rect width="1200" height="820" fill="#ffffff"/>
  <rect x="0" y="0" width="1200" height="6" fill="#16a34a"/>
  <text x="60" y="70" fill="#0f172a" font-family="Inter, Arial" font-size="28" font-weight="800">National Health Insurance System — Ops &amp; RCA</text>
  <text x="60" y="100" fill="#64748b" font-family="Inter, Arial" font-size="15">SQL + log analysis → root cause → dev collaboration → fix redeployed nationwide</text>
  <line x1="60" y1="122" x2="1140" y2="122" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Row 1: system -->
  <rect x="50" y="150" width="1100" height="140" rx="18" fill="#eef3ff" stroke="#d6e2ff"/>
  <rect x="74" y="132" width="330" height="34" rx="17" fill="#1e4fff"/>
  <text x="239" y="155" fill="#fff" font-family="Inter, Arial" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">1 · NATIONWIDE HEALTH INSURANCE PLATFORM</text>

  <g filter="url(#cardShadow)">
    <rect x="310" y="185" width="580" height="80" rx="16" fill="#1e4fff"/>
    <text x="342" y="221" font-size="20">🏛️</text>
    <text x="600" y="222" fill="#fff" text-anchor="middle" font-family="Inter, Arial" font-weight="700" font-size="17">Municipal Health Insurance System</text>
    <text x="600" y="244" fill="rgba(255,255,255,.9)" text-anchor="middle" font-family="Inter, Arial" font-size="13" font-weight="600">Batch processing + instant output · Linux hosts · deployed nationwide (RKKCS)</text>
  </g>

  <!-- Row 2: data & logs -->
  <rect x="50" y="310" width="1100" height="140" rx="18" fill="#fff8ec" stroke="#f7e2b8"/>
  <rect x="74" y="292" width="180" height="34" rx="17" fill="#ff9900"/>
  <text x="164" y="315" fill="#fff" font-family="Inter, Arial" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">2 · DATA &amp; LOGS</text>

  <g filter="url(#cardShadow)">
    <rect x="280" y="345" width="280" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="312" cy="377" r="16" fill="#fff8ec"/>
    <text x="312" y="383" font-size="16" text-anchor="middle">🗄️</text>
    <text x="340" y="378" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">Oracle Database</text>
    <text x="340" y="400" fill="#64748b" font-family="Inter, Arial" font-size="12">SQL queries · data verification</text>

    <rect x="640" y="345" width="280" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="672" cy="377" r="16" fill="#fff8ec"/>
    <text x="672" y="383" font-size="16" text-anchor="middle">📄</text>
    <text x="700" y="372" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">System &amp; Batch Logs</text>
    <text x="700" y="394" fill="#64748b" font-family="Inter, Arial" font-size="12">Account / batch / output errors</text>
  </g>

  <!-- Row 3: ops -->
  <rect x="50" y="470" width="1100" height="140" rx="18" fill="#f0fbf6" stroke="#d3f0e2"/>
  <rect x="74" y="452" width="290" height="34" rx="17" fill="#16a34a"/>
  <text x="219" y="475" fill="#fff" font-family="Inter, Arial" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="0.5">3 · ROOT CAUSE &amp; STABILIZATION</text>

  <g filter="url(#cardShadow)">
    <rect x="280" y="505" width="280" height="80" rx="14" fill="#16a34a"/>
    <circle cx="312" cy="537" r="16" fill="rgba(255,255,255,.22)"/>
    <text x="312" y="543" font-size="16" text-anchor="middle">🔍</text>
    <text x="340" y="536" fill="#fff" font-family="Inter, Arial" font-weight="700" font-size="15">SI/Ops Engineer (me)</text>
    <text x="340" y="558" fill="rgba(255,255,255,.9)" font-family="Inter, Arial" font-size="12">Root cause analysis</text>

    <rect x="640" y="505" width="280" height="80" rx="14" fill="#ffffff" stroke="#e2e8f0"/>
    <circle cx="672" cy="537" r="16" fill="#f0fbf6"/>
    <text x="672" y="543" font-size="16" text-anchor="middle">👥</text>
    <text x="700" y="536" fill="#0f172a" font-family="Inter, Arial" font-weight="700" font-size="15">Development Team</text>
    <text x="700" y="558" fill="#64748b" font-family="Inter, Arial" font-size="12">Stabilization &amp; fixes</text>
  </g>

  <!-- Arrows: system -> data/logs -->
  <g stroke="#1e4fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M420 265L420 345"/>
    <path d="M780 265L780 345"/>
  </g>

  <!-- Arrows: data/logs -> me (converging) -->
  <g stroke="#ff9900" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" opacity=".9">
    <path d="M420 425L390 505"/>
    <path d="M780 425L470 505"/>
  </g>

  <!-- Arrow: me -> dev team -->
  <g stroke="#16a34a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M560 545H640"/>
  </g>

  <!-- Feedback loop: dev team -> system -->
  <g stroke="#1e4fff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 7">
    <path d="M920 545H1080V225H890"/>
  </g>

  <g font-family="Inter, Arial" font-size="13" font-weight="700">
    <text x="440" y="310" fill="#1e4fff">verify</text>
    <text x="700" y="310" fill="#1e4fff">investigate</text>
    <text x="600" y="536" fill="#16a34a" text-anchor="middle">escalate</text>
    <text x="1090" y="360" fill="#1e4fff">fix &amp;</text>
    <text x="1090" y="378" fill="#1e4fff">stabilize</text>
  </g>

  <!-- Legend -->
  <g font-family="Inter, Arial" font-size="13" fill="#64748b">
    <line x1="60" y1="640" x2="92" y2="640" stroke="#1e4fff" stroke-width="2.5"/>
    <text x="100" y="644">시스템 → 데이터 조회</text>
    <line x1="290" y1="640" x2="322" y2="640" stroke="#ff9900" stroke-width="2.5"/>
    <text x="330" y="644">원인 분석 흐름</text>
    <line x1="500" y1="640" x2="532" y2="640" stroke="#16a34a" stroke-width="3"/>
    <text x="540" y="644">개발팀 에스컬레이션</text>
    <line x1="740" y1="640" x2="772" y2="640" stroke="#1e4fff" stroke-width="2.5" stroke-dasharray="6 7"/>
    <text x="780" y="644">수정 반영 (피드백)</text>
  </g>

  <!-- Insight footer -->
  <rect x="50" y="670" width="1100" height="110" rx="16" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="78" y="702" fill="#334155" font-family="Inter, Arial" font-size="15" font-weight="700">신규 버전이 배포될 때마다 적용 전후 데이터를 SQL로 비교하고, 배치·출력 결과를 로그와 교차 확인했습니다.</text>
  <text x="78" y="728" fill="#334155" font-family="Inter, Arial" font-size="14">하나의 표준화된 플랫폼이 전국 단위로 배포되기 때문에, SQL 확인과 로그 판독 하나하나가</text>
  <text x="78" y="750" fill="#334155" font-family="Inter, Arial" font-size="14">지자체 전체에 영향을 미칩니다 — 원인 규명이 먼저, 그다음 개발팀과 함께 안정화합니다.</text>
</svg>
